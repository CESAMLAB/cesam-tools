[package]
name = "mock_bin_ru_s7"
description = "Régulateur de procédé simulé exposé en Siemens S7 (serveur S7comm sur ISO-on-TCP/RFC1006), avec IHM egui. Réutilise mock_lib_control."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version = "1.85"

# Nom de l'exécutable provisoire. Nom commercial à fixer.
[[bin]]
name = "ru_s7"
path = "src/main.rs"

[features]
# Interface graphique embarquée. Activée par défaut (poste de travail).
# `--no-default-features` produit un binaire « headless » : serveur S7 + simulation.
default = ["gui"]
gui = ["dep:eframe", "dep:egui_plot", "dep:image", "dep:mock_lib_update"]

[dependencies]
mock_lib_control = { workspace = true, features = ["serde"] }
# `io-util` : lecture/écriture asynchrone des trames TPKT/COTP/S7 sur la socket TCP.
tokio = { workspace = true, features = ["signal", "io-util"] }
ractor = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Interface graphique (feature `gui` uniquement).
eframe = { workspace = true, optional = true }
egui_plot = { workspace = true, optional = true }
image = { workspace = true, optional = true }
# Vérification de mise à jour (feature `gui` : commodité poste de travail).
mock_lib_update = { workspace = true, optional = true }
