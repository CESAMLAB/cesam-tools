[package]
name = "mock_bin_ru_sparkplugb"
description = "Régulateur de procédé simulé exposé en MQTT Sparkplug B (Edge Node sortant), avec IHM egui. Réutilise mock_lib_control."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# MSRV propre à ce crate : rumqttc/rustls/sparkplug-rs tirent des deps récentes.
# Plancher à fixer après un build réel (le workspace reste à 1.85 pour les autres).
rust-version = "1.85"

# Nom de l'exécutable provisoire. Nom commercial à fixer.
[[bin]]
name = "ru_spb"
path = "src/main.rs"

[features]
# Interface graphique embarquée. Activée par défaut (poste de travail).
# `--no-default-features` produit un binaire « headless » : edge node Sparkplug B +
# simulation sans IHM.
default = ["gui"]
gui = ["dep:eframe", "dep:egui_plot", "dep:image", "dep:mock_lib_update"]

[dependencies]
mock_lib_control = { workspace = true, features = ["serde"] }
rumqttc = { workspace = true }
sparkplug-rs = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
ractor = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }
env_logger = { workspace = true }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# Interface graphique (feature `gui` uniquement).
eframe = { workspace = true, optional = true }
egui_plot = { workspace = true, optional = true }
image = { workspace = true, optional = true }
# Vérification de mise à jour (feature `gui` : commodité poste de travail).
mock_lib_update = { workspace = true, optional = true }
